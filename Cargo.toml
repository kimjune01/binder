[workspace]
members = ["crates/binder-core", "crates/binder-cli", "crates/vault-transition", "crates/vault-program", "crates/vault-mollusk"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
binder-core = { path = "crates/binder-core" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.21"
mollusk-svm = "=0.14.0"
solana-account = "4.3.0"
solana-instruction = "3.0.0"
solana-pubkey = "4.1.0"
solana-program = { version = "3.0.0", default-features = false }
solana-system-interface = { version = "3.0", features = ["bincode"] }
solana-syscalls = "=4.1.1"
solana-sdk-ids = "3.0.0"
