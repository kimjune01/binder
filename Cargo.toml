[workspace]
members = ["crates/binder-core", "crates/binder-cli", "crates/vault-transition"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
binder-core = { path = "crates/binder-core" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.21"

